<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login | DuckWorth's Shine Co.</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .login-shell{max-width:440px;margin-inline:auto}

  .back-home{
    display:inline-flex;align-items:center;gap:.5rem;
    font-size:.82rem;font-weight:500;color:var(--muted);
    padding:.55rem 1rem;border-radius:999px;
    background:var(--bg-2);border:1px solid var(--line);
    margin-bottom:1.5rem;
    transition:border-color .2s,color .2s,transform .2s;
  }
  .back-home:hover{border-color:var(--gold);color:var(--gold);transform:translateX(-2px)}
  .back-home svg{width:14px;height:14px;fill:currentColor;flex-shrink:0}

  .login-card{
    background:var(--bg-2);border:1px solid var(--line);
    border-radius:var(--radius-lg);padding:clamp(1.75rem,4vw,2.5rem);
  }
  .login-card h1{font-size:1.5rem;margin-bottom:.5rem}
  .login-card .lede{margin-bottom:2rem}
  .login-form{display:flex;flex-direction:column;gap:1.1rem}
  .login-error{
    display:none;background:rgba(240,116,95,.12);border:1px solid rgba(240,116,95,.4);
    color:#f0a294;padding:.8rem 1rem;border-radius:var(--radius-sm);font-size:.85rem;margin-bottom:1rem;
  }
  .login-error.is-visible{display:block}
  .login-hint{
    font-size:.78rem;color:var(--muted-2);margin-top:1.5rem;text-align:center;
  }
  .login-hint a{color:var(--gold)}
  .login-signed-in{
    display:none;margin-bottom:1.5rem;padding:1rem 1.15rem;
    background:rgba(20,111,30,.12);border:1px solid rgba(20,111,30,.4);
    border-radius:var(--radius-sm);font-size:.85rem;
    color:#7de394;
  }
  .login-signed-in.is-visible{display:block}
  .login-signed-in a{
    color:var(--gold);text-decoration:underline;margin-left:.35rem;
  }
  .login-signed-in button{
    color:#f0a294;text-decoration:underline;margin-left:.5rem;
    background:none;border:0;cursor:pointer;font-size:.85rem;padding:0;
  }
  .staff-brand{
    display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;
    padding-bottom:1.5rem;border-bottom:1px solid var(--line);
  }
  .staff-brand img{
    width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 44px;
  }
  .staff-brand-text{display:flex;flex-direction:column;line-height:1.15}
  .staff-brand-text strong{font-family:var(--font-head);font-size:.95rem;font-weight:800}
  .staff-brand-text small{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
  <section class="section" style="min-height:80vh;display:grid;place-items:center">
    <div class="wrap login-shell">

      <a class="back-home" href="index.html">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Back to Home
      </a>

      <div class="login-card">

        <div class="staff-brand">
          <img alt="DuckWorth's Shine Co. logo" src="assets/img/logo.png">
          <span class="staff-brand-text">
            <strong>DuckWorth's Shine Co.</strong>
            <small>Staff Portal</small>
          </span>
        </div>

        <div class="login-signed-in" id="signedInNotice">
          You're already signed in.
          <a href="staff-dashboard.html">Go to dashboard →</a>
          <button type="button" id="signOutFromNotice">Sign out</button>
        </div>

        <p class="eyebrow">Staff Only</p>
        <h1>Staff Login</h1>
        <p class="lede">Sign in to manage jobs and update customer statuses.</p>

        <div class="login-error" id="loginError"></div>

        <form class="login-form" id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginBtn">Sign In</button>
        </form>

        <p class="login-hint">
          <a href="status.html">Customer? Track your detail →</a>
        </p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom" style="border-top:0">
    <p>© <span data-year></span> DuckWorth's Shine Co. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  (function () {
    'use strict';

    document.querySelectorAll('[data-year]').forEach(function (el) {
      el.textContent = new Date().getFullYear();
    });

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const signedInNotice = document.getElementById('signedInNotice');
    const signOutFromNotice = document.getElementById('signOutFromNotice');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('is-visible');
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('is-visible');
    }

    function wipeSupabaseStorage() {
      try {
        Object.keys(localStorage)
          .filter(k => k.startsWith('sb-') || k.includes('supabase'))
          .forEach(k => localStorage.removeItem(k));
      } catch (err) {}
      try {
        Object.keys(sessionStorage)
          .filter(k => k.startsWith('sb-') || k.includes('supabase'))
          .forEach(k => sessionStorage.removeItem(k));
      } catch (err) {}
    }

    async function doSignOut() {
      try {
        await supabaseClient.auth.signOut({ scope: 'local' });
      } catch (err) {
        console.warn('signOut threw, forcing local clear', err);
      }
      wipeSupabaseStorage();
    }

    (async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user && session.user.email === 'detail@duckworthsshine.com') {
          signedInNotice.classList.add('is-visible');
        }
      } catch (err) {
        console.warn('Session check failed:', err);
      }
    })();

    signOutFromNotice.addEventListener('click', async () => {
      signedInNotice.classList.remove('is-visible');
      await doSignOut();
      clearError();
      window.location.href = 'staff-login.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (email.toLowerCase() !== 'detail@duckworthsshine.com') {
        showError('This account does not have staff access.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        let msg = 'Sign-in failed. Check your email and password.';
        const lower = (error.message || '').toLowerCase();
        if (lower.includes('not confirmed')) {
          msg = 'Your account is not confirmed yet.';
        } else if (lower.includes('invalid login')) {
          msg = 'Incorrect email or password.';
        }
        showError(msg);
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      window.location.href = 'staff-dashboard.html';
    });
  })();
</script>
</body>
</html>
